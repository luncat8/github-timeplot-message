<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>github timeplot message</title>
<style>
	:root {
		--bg: #ffffff;
		--fg: #1f2328;
		--muted: #57606a;
		--border: #d0d7de;
		--panel: #f6f8fa;
		--green: #1a7f37;
	}
	* { box-sizing: border-box; }
	body {
		margin: 0;
		font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
		color: var(--fg);
		background: var(--bg);
	}
	#app {
		max-width: 1100px;
		margin: 0 auto;
		padding: 16px;
		display: flex;
		flex-direction: column;
		gap: 10px;
	}
	h1 { font-size: 16px; margin: 0; font-weight: 600; }
	h1 small { color: var(--muted); font-weight: 400; }
	.step {
		color: var(--muted);
		font-size: 12px;
		font-weight: 600;
		text-transform: uppercase;
		letter-spacing: 0.04em;
		min-width: 64px;
	}
	.row {
		display: flex;
		flex-wrap: wrap;
		gap: 10px;
		align-items: center;
		background: var(--panel);
		border: 1px solid var(--border);
		border-radius: 6px;
		padding: 8px 10px;
	}
	label {
		display: inline-flex;
		gap: 6px;
		align-items: center;
		color: var(--muted);
		font-size: 13px;
		white-space: nowrap;
	}
	input[type="text"], input[type="password"] {
		border: 1px solid var(--border);
		border-radius: 6px;
		padding: 3px 8px;
		background: #fff;
		color: var(--fg);
		font: inherit;
	}
	input[type="range"] { vertical-align: middle; width: 120px; }
	label b { color: var(--fg); min-width: 1.6em; text-align: right; }
	select {
		border: 1px solid var(--border);
		border-radius: 6px;
		padding: 3px 6px;
		background: #fff;
		color: var(--fg);
		font: inherit;
	}
	button {
		border: 1px solid var(--border);
		background: var(--panel);
		color: var(--fg);
		border-radius: 6px;
		padding: 3px 12px;
		cursor: pointer;
		font: inherit;
	}
	button:hover { background: #eef1f4; }
	button.on { background: var(--green); border-color: var(--green); color: #fff; }
	button:disabled { opacity: 0.5; cursor: default; }
	.grow { flex: 1; min-width: 220px; }
	#plotWrap {
		position: relative;
		border: 1px solid var(--border);
		border-radius: 6px;
		padding: 10px;
		background: #fff;
	}
	canvas {
		display: block;
		width: 100%;
		max-width: 1037px;
		touch-action: none;
	}
	#plot {
		height: auto;
		cursor: crosshair;
	}
	#track {
		height: 40px;
		margin-top: 4px;
		cursor: ew-resize;
	}
	#trackWrap {
		position: relative;
		max-width: 1037px;
	}
	#trackLabel {
		position: absolute;
		pointer-events: none;
		background: #1f2328;
		color: #fff;
		font-size: 12px;
		padding: 3px 7px;
		border-radius: 5px;
		white-space: nowrap;
		transform: translate(-50%, -100%);
		z-index: 4;
	}
	#offsetReadout {
		display: inline-flex;
		gap: 6px;
		align-items: baseline;
		color: var(--muted);
		font-size: 12px;
	}
	#offsetReadout b { color: var(--fg); font-size: 14px; font-weight: 600; min-width: 2.4em; text-align: right; }
	#tip {
		position: absolute;
		pointer-events: none;
		background: #1f2328;
		color: #fff;
		font-size: 12px;
		padding: 4px 8px;
		border-radius: 6px;
		white-space: nowrap;
		transform: translate(-50%, -100%);
		z-index: 5;
	}
	.suggest { flex-basis: 100%; font-size: 13px; }
	#legend { flex-basis: 100%; }
	#plan { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px; }
	.pd {
		display: flex;
		flex-direction: column;
		gap: 1px;
		min-width: 112px;
		padding: 4px 8px;
		border: 1px solid var(--border);
		border-radius: 6px;
		background: #fff;
		font-size: 12px;
	}
	.pd b { font-weight: 600; }
	.pd .lvl { color: var(--fg); }
	.pd .st { color: var(--muted); }
	.pd.today { border-color: var(--green); box-shadow: 0 0 0 2px rgba(26, 127, 55, 0.16); }
	.pd.due .st { color: #9a6700; font-weight: 600; }
	.pd.met .st { color: var(--green); font-weight: 600; }
	.pd.rest { opacity: 0.6; }
	#planSummary { flex: 1; text-align: right; }
	.muted { color: var(--muted); font-size: 12px; }
	#legend { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-size: 12px; color: var(--muted); }
	.sw {
		width: 13px; height: 13px;
		border-radius: 3px;
		display: inline-block;
		margin-right: 4px;
		vertical-align: -3px;
		border: 1px solid rgba(0,0,0,.08);
	}
	footer { padding: 0 10px; }
	#status { min-height: 1.2em; }
</style>
</head>
<body>
<div id="app">
	<header>
		<h1>github timeplot message <small>paint your profile</small></h1>
	</header>

	<section class="row">
		<span class="step">1 fetch</span>
		<label>github
			<input id="ghUser" type="text" placeholder="username" spellcheck="false" style="width:130px">
		</label>
		<label>
			<input id="ghToken" type="password" placeholder="optional PAT" spellcheck="false" style="width:140px">
		</label>
		<button id="btnFetch" title="fetch contributions: overlay dots, done counts, recommended low / high">fetch</button>
		<button id="btnDemo" title="simulate everything: typical background commits + smooth HELLO WORLD, recommended low / high — try it without a github account">demo</button>
		<span class="muted">fetch recommends low / high from your median and busy days · demo fakes it</span>
	</section>

	<section class="row">
		<span class="step">2 tools</span>
		<button id="toolDraw" class="on" title="draw (D)">draw</button>
		<button id="toolErase" title="erase (E)">erase</button>
		<button id="toolRect" title="rectangle drag (R)">rect</button>
		<label title="commits on background / erased days">low / erase
			<input id="low" type="range" min="0" max="50" step="1" value="0">
			<b id="lowVal">0</b>
		</label>
		<label title="commits on drawn days">high / draw
			<input id="high" type="range" min="0" max="50" step="1" value="10">
			<b id="highVal">10</b>
		</label>
		<button id="btnFill" title="fill grid with the draw level (F)">fill</button>
		<button id="btnClear" title="clear grid (C)">clear</button>
		<button id="btnUndo" title="undo (Ctrl+Z)">undo</button>
		<label>display
			<select id="display">
				<option value="grad">gradient</option>
				<option value="quant">github</option>
			</select>
		</label>
	</section>

	<section class="row">
		<span class="step">3 text</span>
		<label class="grow">
			<input id="text" type="text" maxlength="40" placeholder="HI" spellcheck="false" style="flex:1;min-width:140px">
		</label>
		<select id="textFont" title="text render style">
			<option value="auto">pixel auto</option>
			<option value="57">pixel 5x7</option>
			<option value="35">pixel 3x5</option>
			<option value="smooth">smooth</option>
		</select>
		<label title="replace = overwrite grid; unchecked = merge (max)">
			<input type="checkbox" id="textReplace" checked> replace
		</label>
		<button id="btnRender">render</button>
	</section>

	<div id="plotWrap">
		<canvas id="plot"></canvas>
		<div id="trackWrap">
			<canvas id="track" tabindex="0" aria-label="week offset"></canvas>
			<div id="trackLabel" hidden></div>
		</div>
		<div id="tip" hidden></div>
	</div>

	<section class="row">
		<span class="step">4 info</span>
		<span id="offsetReadout">offset <b id="offsetVal">0</b> w</span>
		<span id="range" class="muted"></span>
		<div id="legend"></div>
		<div id="suggest" class="suggest"></div>
	</section>

	<section class="row">
		<span class="step">5 plan</span>
		<label>days
			<select id="planDays">
				<option value="7">7</option>
				<option value="14" selected>14</option>
				<option value="30">30</option>
			</select>
		</label>
		<label title="adds the commits you missed in the last 7 days to today's target">
			<input type="checkbox" id="planCarry" checked> carry shortfall
		</label>
		<span id="planSummary" class="muted"></span>
		<div id="plan"></div>
	</section>

	<section class="row">
		<span class="step">6 share</span>
		<button id="btnExport" title="copy GTM1 string + download .gtm">export</button>
		<button id="btnPng" title="download rendered grid as PNG">PNG</button>
		<button id="btnImport" title="import from .gtm/.txt/.json file">import</button>
		<button id="btnPaste" title="paste a GTM1 string">paste</button>
		<input type="file" id="fileImport" accept=".gtm,.txt,.json,text/plain,application/json" hidden>
	</section>

	<footer>
		<div id="status" class="muted"></div>
	</footer>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
